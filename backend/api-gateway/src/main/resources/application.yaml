server:
  port: 8080   # ÚNICA porta que o cliente final (Postman/Angular/etc) precisa conhecer

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # roteamento manual (mais didático que o automático) — cada rota é explícita abaixo
      routes:
        - id: ms-aluno-route
          uri: lb://ms-aluno
          predicates:
            - Path=/alunos/**

        - id: ms-matricula-route
          uri: lb://ms-matricula
          predicates:
            - Path=/matriculas/**

        # Disciplina mora dentro do ms-matricula (mesmo serviço), então a rota
        # aponta pro mesmo destino da rota acima — só muda o prefixo da URL.
        - id: ms-disciplina-route
          uri: lb://ms-matricula
          predicates:
            - Path=/disciplinas/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
